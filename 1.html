 <!DOCTYPE html>
<html>
<head>
    <title>Basic Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

     
    <input type="checkbox" id="play">

     
    <h3>Perfect</h3>

     
    <div class="progress-bar">
        <div class="progress"></div>
    </div>

    
    <div class="controls">
        <span class="btn">⏮</span>
        <label for="play" class="btn play"></label>
        <span class="btn">⏭</span>
    </div>

</div>

</body>
</html>
